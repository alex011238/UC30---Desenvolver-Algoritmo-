<!DOCTYPE html>
<html lang ="pt">
<head>
    <title>Login</title>
</head>
<body>

    <h1>Login</h1>

    <form method="POST">
        <label>Usuário:</label><br>
        <input type="text" name="usuario" required><br><br>

        <label>Senha:</label><br>
        <input type="password" name="senha" required><br><br>

        <button type="submit">Entrar</button>
    </form>

    {% if erro %}
        <p style="color:red;">{{ erro }}</p>
    {% endif %}

</body>
</html>
