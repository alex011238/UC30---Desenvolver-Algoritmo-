<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Cantinho</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e1e5e9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: rgb(174, 165, 165);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0,0,0,.15);
            width: 400px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
        }

        ul {
            list-style: none;
            padding: 0;
            text-align: left;
        }

        li {
            margin: 12px 0;
        }

        button {
            margin-top: 20px;
            padding: 10px 18px;
            border: none;
            background: #3498db;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Meu Cantinho</h1>

    <h2 id="saudacao"></h2>

    <ul>
        <li><strong> Cor favorita:</strong> Azul</li>
        <li><strong> Linguagem favorita:</strong> JavaScript</li>
        <li><strong> Frase:</strong> "Nunca pare de aprender."</li>
    </ul>

    <button onclick="voltarPainel()">⬅ Voltar ao Painel</button>
</div>

<script>
    // Verifica se o usuário está logado
    const usuario = localStorage.getItem("usuarioLogado");

    if (!usuario) {
        alert("Você precisa estar logado para acessar esta página.");
        window.location.href = "login.html";
    } else {
        document.getElementById("saudacao").textContent =
            `Olá, ${usuario}! Este é o seu cantinho secreto.`;
    }

    function voltarPainel() {
        window.location.href = "painel.html";
    }
</script>

</body>
</html>
